<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Decorative rings -->
  <circle cx="700" cy="100" r="200" fill="none" stroke="#84cc16" stroke-width="1" opacity="0.12"/>
  <circle cx="700" cy="100" r="140" fill="none" stroke="#84cc16" stroke-width="1" opacity="0.1"/>
  <circle cx="80" cy="420" r="180" fill="none" stroke="#a3e635" stroke-width="1" opacity="0.1"/>
  <circle cx="80" cy="420" r="110" fill="none" stroke="#a3e635" stroke-width="1" opacity="0.08"/>

  <!-- Floating particles / leaves -->
  <ellipse cx="600" cy="160" rx="10" ry="16" fill="#86efac" opacity="0.25" transform="rotate(-30 600 160)"/>
  <ellipse cx="220" cy="130" rx="8" ry="14" fill="#86efac" opacity="0.2" transform="rotate(20 220 130)"/>
  <ellipse cx="660" cy="300" rx="9" ry="15" fill="#a3e635" opacity="0.2" transform="rotate(-50 660 300)"/>
  <ellipse cx="180" cy="320" rx="7" ry="12" fill="#86efac" opacity="0.2" transform="rotate(40 180 320)"/>
  <ellipse cx="520" cy="100" rx="8" ry="14" fill="#a3e635" opacity="0.2" transform="rotate(-15 520 100)"/>
  <circle cx="350" cy="110" r="4" fill="#d9f99d" opacity="0.3"/>
  <circle cx="480" cy="360" r="3" fill="#d9f99d" opacity="0.25"/>
  <circle cx="140" cy="240" r="4" fill="#d9f99d" opacity="0.3"/>

  <!-- Ground line -->
  <rect x="150" y="360" width="500" height="3" rx="2" fill="#a3e635" opacity="0.2"/>

  <!-- Broom handle -->
  <rect x="395" y="130" width="12" height="200" rx="6" fill="white" opacity="0.9" transform="rotate(15 401 230)"/>

  <!-- Broom head -->
  <ellipse cx="368" cy="345" rx="55" ry="18" fill="#a3e635" opacity="0.9" transform="rotate(15 368 345)"/>
  <rect x="320" y="340" width="96" height="22" rx="8" fill="#65a30d" opacity="0.8" transform="rotate(15 368 351)"/>
  <!-- Bristles -->
  <line x1="320" y1="358" x2="308" y2="378" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="rotate(15 320 358)"/>
  <line x1="335" y1="360" x2="325" y2="382" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="rotate(15 335 360)"/>
  <line x1="350" y1="361" x2="342" y2="384" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="rotate(15 350 361)"/>
  <line x1="365" y1="362" x2="359" y2="385" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="rotate(15 365 362)"/>
  <line x1="380" y1="361" x2="376" y2="384" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="rotate(15 380 361)"/>
  <line x1="395" y1="360" x2="393" y2="382" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="rotate(15 395 360)"/>
  <line x1="410" y1="358" x2="410" y2="380" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" opacity="0.8" transform="rotate(15 410 358)"/>

  <!-- Tree / plant (right side) -->
  <circle cx="580" cy="230" r="55" fill="#4ade80" opacity="0.25"/>
  <circle cx="560" cy="200" r="40" fill="#4ade80" opacity="0.3"/>
  <circle cx="605" cy="210" r="42" fill="#4ade80" opacity="0.28"/>
  <rect x="576" y="275" width="10" height="50" rx="4" fill="#65a30d" opacity="0.6"/>

  <!-- Recycling symbol hint (left) -->
  <circle cx="220" cy="230" r="40" fill="none" stroke="#a3e635" stroke-width="2.5" opacity="0.4"/>
  <path d="M220 195 L232 215 L208 215 Z" fill="#a3e635" opacity="0.4"/>
  <path d="M248 238 L228 226 L240 250 Z" fill="#a3e635" opacity="0.4" transform="rotate(120 220 230)"/>
  <path d="M248 238 L228 226 L240 250 Z" fill="#a3e635" opacity="0.4" transform="rotate(240 220 230)"/>

  <!-- Shine dots scattered -->
  <circle cx="460" cy="180" r="3" fill="#d9f99d" opacity="0.5"/>
  <circle cx="290" cy="160" r="2" fill="#d9f99d" opacity="0.4"/>
  <circle cx="510" cy="290" r="2.5" fill="#d9f99d" opacity="0.4"/>

  <!-- Text -->
  <text x="400" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" opacity="0.9" letter-spacing="2">COMMUNITY CLEAN-UP DRIVE</text>
  <text x="400" y="442" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#a3e635" text-anchor="middle" opacity="0.7" letter-spacing="1">Youth Volunteers · Public Spaces · Greener Communities</text>
</svg>
