<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="book2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Decorative rings -->
  <circle cx="680" cy="90" r="190" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.12"/>
  <circle cx="680" cy="90" r="130" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.1"/>
  <circle cx="90" cy="410" r="170" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.1"/>
  <circle cx="90" cy="410" r="110" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.08"/>

  <!-- Stars / sparkles -->
  <circle cx="200" cy="120" r="3" fill="#fde68a" opacity="0.6"/>
  <circle cx="600" cy="100" r="2.5" fill="#fde68a" opacity="0.5"/>
  <circle cx="680" cy="320" r="3" fill="#fde68a" opacity="0.4"/>
  <circle cx="160" cy="300" r="2" fill="#fde68a" opacity="0.5"/>
  <circle cx="530" cy="380" r="3" fill="#fde68a" opacity="0.4"/>
  <!-- Star shapes -->
  <polygon points="560,140 564,152 577,152 567,160 571,172 560,164 549,172 553,160 543,152 556,152" fill="#fbbf24" opacity="0.35"/>
  <polygon points="240,360 243,369 252,369 245,375 248,384 240,378 232,384 235,375 228,369 237,369" fill="#fbbf24" opacity="0.3"/>
  <polygon points="640,220 643,229 652,229 645,235 648,244 640,238 632,244 635,235 628,229 637,229" fill="#fbbf24" opacity="0.3"/>

  <!-- Book stack (center-left) -->
  <!-- Bottom book (green) -->
  <rect x="290" y="290" width="160" height="22" rx="4" fill="#4ade80" opacity="0.85"/>
  <rect x="290" y="288" width="12" height="24" rx="2" fill="#16a34a" opacity="0.9"/>
  <!-- Middle book (orange) -->
  <rect x="296" y="268" width="160" height="22" rx="4" fill="url(#bookGrad)" opacity="0.9"/>
  <rect x="296" y="266" width="12" height="24" rx="2" fill="#c2410c" opacity="0.9"/>
  <!-- Top book (blue) -->
  <rect x="300" y="245" width="160" height="24" rx="4" fill="url(#book2Grad)" opacity="0.9"/>
  <rect x="300" y="243" width="12" height="26" rx="2" fill="#0369a1" opacity="0.9"/>

  <!-- Open book (front center) -->
  <path d="M330 170 Q370 155 400 165 Q430 155 470 170 L470 260 Q430 248 400 258 Q370 248 330 260 Z" fill="white" opacity="0.95"/>
  <!-- Book spine -->
  <line x1="400" y1="165" x2="400" y2="258" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
  <!-- Book lines (text simulation) -->
  <line x1="345" y1="185" x2="393" y2="182" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="345" y1="196" x2="393" y2="193" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="345" y1="207" x2="393" y2="204" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="345" y1="218" x2="390" y2="216" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="345" y1="229" x2="388" y2="228" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="407" y1="182" x2="455" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="407" y1="193" x2="455" y2="196" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="407" y1="204" x2="455" y2="207" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="407" y1="216" x2="452" y2="218" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="407" y1="228" x2="450" y2="229" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Pencil (right side, diagonal) -->
  <g transform="rotate(-35 580 220)">
    <rect x="548" y="140" width="18" height="120" rx="2" fill="#fbbf24" opacity="0.9"/>
    <polygon points="548,260 566,260 557,285" fill="#fcd34d" opacity="0.9"/>
    <polygon points="552,275 562,275 557,285" fill="#78716c" opacity="0.8"/>
    <rect x="548" y="140" width="18" height="12" rx="2" fill="#f87171" opacity="0.9"/>
    <rect x="550" y="152" width="14" height="6" fill="#fca5a5" opacity="0.7"/>
  </g>

  <!-- Graduation cap hint (top right) -->
  <rect x="580" y="170" width="60" height="8" rx="2" fill="white" opacity="0.6"/>
  <polygon points="610,148 580,170 640,170" fill="white" opacity="0.6"/>
  <line x1="640" y1="170" x2="648" y2="195" stroke="white" stroke-width="2.5" opacity="0.6"/>
  <circle cx="648" cy="198" r="5" fill="#F97316" opacity="0.8"/>

  <!-- Text -->
  <text x="400" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" opacity="0.9" letter-spacing="2">BACK TO SCHOOL DRIVE</text>
  <text x="400" y="442" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle" opacity="0.7" letter-spacing="1">School Bags · Stationery · Uniforms · Hope</text>
</svg>
