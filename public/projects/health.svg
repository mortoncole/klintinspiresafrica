<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Decorative rings -->
  <circle cx="680" cy="80" r="180" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.15"/>
  <circle cx="680" cy="80" r="130" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.12"/>
  <circle cx="100" cy="400" r="160" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.1"/>
  <circle cx="100" cy="400" r="100" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.08"/>

  <!-- Floating dots -->
  <circle cx="200" cy="100" r="4" fill="#5eead4" opacity="0.4"/>
  <circle cx="620" cy="340" r="3" fill="#5eead4" opacity="0.3"/>
  <circle cx="700" cy="250" r="5" fill="#99f6e4" opacity="0.25"/>
  <circle cx="150" cy="200" r="3" fill="#5eead4" opacity="0.35"/>
  <circle cx="550" cy="80" r="4" fill="#99f6e4" opacity="0.3"/>

  <!-- Central white card glow -->
  <ellipse cx="400" cy="240" rx="200" ry="160" fill="white" opacity="0.04"/>

  <!-- Large medical cross -->
  <rect x="368" y="140" width="64" height="200" rx="12" fill="white" opacity="0.95"/>
  <rect x="300" y="208" width="200" height="64" rx="12" fill="white" opacity="0.95"/>

  <!-- Heart inside cross center -->
  <path d="M400 262 C400 262 378 245 378 232 C378 224 384 218 392 218 C396 218 400 222 400 222 C400 222 404 218 408 218 C416 218 422 224 422 232 C422 245 400 262 400 262Z" fill="#0f766e"/>

  <!-- Stethoscope icon — bottom left of cross -->
  <circle cx="310" cy="290" r="18" fill="none" stroke="#5eead4" stroke-width="3" opacity="0.7"/>
  <path d="M310 272 L310 252 Q310 240 322 240 L334 240" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="334" cy="237" r="5" fill="#5eead4" opacity="0.7"/>

  <!-- Pulse / heartbeat line -->
  <polyline points="260,370 300,370 318,340 336,400 354,355 372,370 540,370" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Text -->
  <text x="400" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" opacity="0.9" letter-spacing="2">HEALTH AWARENESS DRIVE</text>
  <text x="400" y="442" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5eead4" text-anchor="middle" opacity="0.7" letter-spacing="1">Free Screenings · Wellness Talks · Hygiene Kits</text>
</svg>
